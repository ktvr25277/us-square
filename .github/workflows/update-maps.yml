name: Update Tax Foundation Maps

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and update maps
        run: node .github/scripts/update-maps.js

      - name: Commit if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add images/tax.png images/income-tax.png
          git diff --staged --quiet || git commit -m "Auto-update: Tax Foundation maps $(date +'%Y-%m')"
          git push
